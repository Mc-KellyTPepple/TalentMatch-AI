services:
  - type: web
    name: talentmatch-ai
    runtime: python
    plan: free

    buildCommand: pip install --no-cache-dir -r requirements.txt

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

      - key: TOKENIZERS_PARALLELISM
        value: "false"

      - key: OMP_NUM_THREADS
        value: "1"

      - key: MKL_NUM_THREADS
        value: "1"
