services:
  - type: web
    name: talentmatch-ai
    runtime: python

    buildCommand: pip install --no-cache-dir -r requirements.txt

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: TOKENIZERS_PARALLELISM
        value: "false"

      - key: OMP_NUM_THREADS
        value: "1"

      - key: MKL_NUM_THREADS
        value: "1"

      - key: OPENBLAS_NUM_THREADS
        value: "1"

      - key: NUMEXPR_NUM_THREADS
        value: "1"

      - key: PYTHONUNBUFFERED
        value: "1"

    healthCheckPath: /health
