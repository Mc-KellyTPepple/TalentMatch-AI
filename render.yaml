services:
  - type: web
    name: TalentMatch-AI
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Optional: enables AI re-ranking. Add the real key in the Render dashboard.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      # Live vacancy feeds (Remotive + Arbeitnow). Set to 0 to disable.
      - key: LIVE_JOBS
        value: "1"
      - key: LIVE_JOBS_TTL_HOURS
        value: "6"
