services:
  - type: web
    name: TalentMatch-AI
    runtime: python
    plan: free

    buildCommand: pip install --no-cache-dir -r requirements.txt

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11
